# Dependabot version updates (#468). Security updates are separate: they
# ignore the grouping and the PR limit below.
#
# npm: minor and patch updates arrive as one grouped PR each week; major
# updates arrive as individual PRs. Upgrading the major versions the app
# is built on is release work, tracked in #469.
#
# GitHub Actions: every update, majors included, arrives in one grouped
# PR each week, so the CI changes land through one CI and merge cycle.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The one npm major we hold back. "typescript" is an alias of
    # @typescript/typescript6 (#469): TypeScript 7, which provides `tsc` as
    # @typescript/native, has no JavaScript API yet, and typescript-eslint,
    # eslint-plugin-sonarjs and scripts/traceability.mjs need the 6.x API.
    # Remove this rule once they support TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The workflows, and the composite action they share (#660)
    directories:
      - /
      - /.github/actions/install-dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - major
          - minor
          - patch

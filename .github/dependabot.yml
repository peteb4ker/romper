# Dependabot version updates (#468). Security updates are separate: they
# ignore the grouping and the PR limit below.
#
# Minor and patch updates arrive as one grouped PR per ecosystem each
# week; major updates arrive as individual PRs. Upgrading the major
# versions the app is built on is release work, tracked in #469.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The workflows, and the composite action they share (#660)
    directories:
      - /
      - /.github/actions/install-dependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

name: End-to-End Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # Allow manual trigger
  workflow_dispatch:
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # Cancel superseded runs on the same branch/PR; never cancel main-push runs
  # (they carry coverage + SonarCloud).
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which runners to use, and how many shards each runs (#660). Every
  # push and pull request runs all three platforms for now; a follow-up
  # (#660) brings back a Linux-only run for PRs that change only tests or
  # docs, with its proof.
  #
  # Shards per platform: the suite takes about 8 minutes on macOS, 6 on
  # Windows and 4 on Linux on one runner (workers: 1), so macOS gets three
  # shards and the others two, bringing each to about 3 minutes of tests.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.plan.outputs.os }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose the runners
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # plan <os>:<shards>...  writes the os list and the job matrix
          plan() {
            local spec os n i oses=() jobs=()
            for spec in "$@"; do
              os=${spec%%:*}
              n=${spec##*:}
              oses+=("\"$os\"")
              for ((i = 1; i <= n; i++)); do
                jobs+=("{\"os\":\"$os\",\"shard\":$i,\"shards\":$n}")
              done
            done
            local IFS=,
            echo "os=[${oses[*]}]" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${jobs[*]}]}" >> "$GITHUB_OUTPUT"
          }
          all() { plan ubuntu-latest:2 macos-latest:3 windows-latest:2; }
          linux() { plan ubuntu-latest:2; }

          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            all
          else
            linux
          fi

  e2e-tests:
    needs: plan
    name: e2e-tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          electron: "true"

      - name: Show system info (debugging)
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
        shell: bash

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev \
            libgtk-3-0 \
            x11-utils \
            xvfb

      - name: Configure Electron sandbox (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The binary came with Install dependencies (electron: "true").
          # Configure chrome-sandbox for proper sandboxing in CI
          CHROME_SANDBOX_PATH="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$CHROME_SANDBOX_PATH" ]; then
            sudo chown root "$CHROME_SANDBOX_PATH"
            sudo chmod 4755 "$CHROME_SANDBOX_PATH"
            echo "Configured chrome-sandbox with proper permissions"
            ls -la "$CHROME_SANDBOX_PATH"
          else
            echo "WARNING: chrome-sandbox not found at expected path"
            FOUND_PATH=$(find node_modules/electron -name "chrome-sandbox" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND_PATH" ]; then
              echo "Found chrome-sandbox at: $FOUND_PATH"
              sudo chown root "$FOUND_PATH"
              sudo chmod 4755 "$FOUND_PATH"
            else
              echo "chrome-sandbox not found - tests will use --no-sandbox flag"
            fi
          fi

      - name: Setup test environment
        run: |
          mkdir -p /tmp/e2e-sdcard
          mkdir -p /tmp/e2e-test-data
          # Copy test fixtures if they exist
          if [ -d "tests/fixtures" ]; then
            cp -r tests/fixtures/* /tmp/e2e-test-data/
          fi
        shell: bash

      - name: Setup test environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir C:\temp\e2e-sdcard
          mkdir C:\temp\e2e-test-data
          if exist tests\fixtures xcopy tests\fixtures C:\temp\e2e-test-data\ /E /I /Q
        shell: cmd

      - name: Build application
        run: npm run build

      - name: Verify build output (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          echo "Checking build output..."
          ls -la dist/
          ls -la dist/electron/
          ls -la dist/electron/main/
          if [ ! -f "dist/electron/main/index.js" ]; then
            echo "ERROR: Main Electron file not found!"
            exit 1
          fi
          echo "Build verification successful"
        shell: bash

      - name: Verify build output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Checking build output..."
          dir dist\
          dir dist\electron\
          dir dist\electron\main\
          if (!(Test-Path "dist\electron\main\index.js")) {
            Write-Error "ERROR: Main Electron file not found!"
            exit 1
          }
          echo "Build verification successful"
        shell: pwsh

      - name: Setup virtual display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          # Validate Xvfb is ready with retry (up to 10 attempts, 1s apart)
          for i in $(seq 1 10); do
            if DISPLAY=:99 xdpyinfo > /dev/null 2>&1; then
              echo "Xvfb display :99 ready after $i attempt(s)"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "ERROR: Xvfb display :99 failed to start after 10 attempts"
              exit 1
            fi
            echo "Waiting for Xvfb... attempt $i/10"
            sleep 1
          done

      - name: Run end-to-end tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        # test:play (not test:e2e) — the build already ran above; test:e2e
        # would rebuild a second time.
        run: npm run test:play -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          ROMPER_SDCARD_PATH: /tmp/e2e-sdcard
          # Performance budget results, for the testing summary
          ROMPER_BUDGET_REPORT: reports/budgets-e2e.jsonl
          CI: true
          DISPLAY: ":99"

      - name: Run end-to-end tests (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run test:play -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          ROMPER_SDCARD_PATH: C:\temp\e2e-sdcard
          ROMPER_BUDGET_REPORT: reports/budgets-e2e.jsonl
          CI: true

      # Playwright retries a failed test once on CI; a test that passed only
      # on retry doesn't fail the job, so list it here to be filed (#659)
      - name: List tests that passed only on retry
        if: always()
        run: node scripts/e2e-flaky-summary.mjs reports/results-e2e.json --platform "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }}
        shell: bash

      # One per shard; testing-summary.mjs adds a platform's shards up, and
      # e2e-tests-check below shows the totals in its job summary
      - name: Upload results for the testing summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-e2e-${{ matrix.os }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: reports/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.os }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.os }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: test-results/**/*.png
          retention-days: 7

  # The required check: reports on every run, whichever runners ran, and
  # fails if choosing them failed or any shard on any platform did. A
  # matrix job's result is "success" only when every one of its jobs passed.
  e2e-tests-check:
    runs-on: ubuntu-latest
    needs: [plan, e2e-tests]
    if: always()
    steps:
      - name: Download the shards' results
        if: needs.plan.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-e2e-*
          path: shards

      # Informational: the gate is the next step
      - name: Add up the shards
        if: needs.plan.result == 'success'
        continue-on-error: true
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          {
            echo "### End-to-end tests"
            echo
            echo "| Platform | Shards reported | Passed | Flaky | Failed | Skipped |"
            echo "| --- | --- | --- | --- | --- | --- |"
            for os in $(jq -r '[.include[].os] | unique | .[]' <<< "$MATRIX"); do
              planned=$(jq --arg os "$os" '[.include[] | select(.os == $os)] | length' <<< "$MATRIX")
              shopt -s nullglob
              reports=(shards/test-results-e2e-"$os"-shard-*/results-e2e.json)
              shopt -u nullglob
              if [ "${#reports[@]}" -eq 0 ]; then
                echo "| $os | 0 of $planned | | | | |"
                continue
              fi
              jq -rs --arg os "$os" --arg shards "${#reports[@]} of $planned" '
                map(.stats) as $s
                | def total(k): $s | map(.[k] // 0) | add;
                "| \($os) | \($shards) | \(total("expected")) | \(total("flaky")) | \(total("unexpected")) | \(total("skipped")) |"
              ' "${reports[@]}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check e2e test results
        if: always()
        env:
          OS: ${{ needs.plan.outputs.os }}
          PLAN: ${{ needs.plan.result }}
          RESULT: ${{ needs.e2e-tests.result }}
        run: |
          echo "Runners: $OS"
          if [[ "$PLAN" == "success" && "$RESULT" == "success" ]]; then
            echo "All e2e tests passed!"
            exit 0
          else
            echo "Some e2e tests failed! (plan: $PLAN, e2e-tests: $RESULT)"
            exit 1
          fi

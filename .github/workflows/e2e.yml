name: End-to-End Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # Allow manual trigger
  workflow_dispatch:
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # Cancel superseded runs on the same branch/PR; never cancel main-push runs
  # (they carry coverage + SonarCloud).
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which runners to use (RE-52, #467). Pushes (main, and the release's
  # tag) run all three. A pull request runs Linux, plus macOS and Windows
  # when it changes something that can behave differently there: the app,
  # the e2e specs and their support, or how they're built and run. Other
  # PRs (docs, unit tests, scripts) run Linux only.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.plan.outputs.os }}
    steps:
      - name: Choose the runners
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          if [ "$EVENT" = "push" ]; then
            echo "os=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If the file list can't be read, run every platform
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "Couldn't list the PR's files; running every platform"
            echo "os=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          platform_paths='^(electron/|app/|shared/|tests/e2e/|tests/utils/|tests/validation/support/|\.github/workflows/e2e\.yml$|playwright\.config\.ts$|package\.json$|package-lock\.json$)'
          matched=$(printf '%s\n' "$files" | grep -E "$platform_paths" || true)
          if [ -n "$matched" ]; then
            echo "These files can behave differently per platform, so e2e runs on all three:"
            printf '%s\n' "$matched" | sed 's/^/  /'
            echo "os=$all" >> "$GITHUB_OUTPUT"
          else
            echo "No app, e2e or build files changed; e2e runs on Linux only"
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  e2e-tests:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show system info (debugging)
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
        shell: bash

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev \
            libgtk-3-0 \
            x11-utils

      - name: Configure Electron sandbox (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Electron 42+ downloads its binary on first use, not at install;
          # fetch it now so chrome-sandbox exists to be configured
          node node_modules/electron/install.js
          # Configure chrome-sandbox for proper sandboxing in CI
          CHROME_SANDBOX_PATH="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$CHROME_SANDBOX_PATH" ]; then
            sudo chown root "$CHROME_SANDBOX_PATH"
            sudo chmod 4755 "$CHROME_SANDBOX_PATH"
            echo "Configured chrome-sandbox with proper permissions"
            ls -la "$CHROME_SANDBOX_PATH"
          else
            echo "WARNING: chrome-sandbox not found at expected path"
            FOUND_PATH=$(find node_modules/electron -name "chrome-sandbox" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND_PATH" ]; then
              echo "Found chrome-sandbox at: $FOUND_PATH"
              sudo chown root "$FOUND_PATH"
              sudo chmod 4755 "$FOUND_PATH"
            else
              echo "chrome-sandbox not found - tests will use --no-sandbox flag"
            fi
          fi

      - name: Setup test environment
        run: |
          mkdir -p /tmp/e2e-sdcard
          mkdir -p /tmp/e2e-test-data
          # Copy test fixtures if they exist
          if [ -d "tests/fixtures" ]; then
            cp -r tests/fixtures/* /tmp/e2e-test-data/
          fi
        shell: bash

      - name: Setup test environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir C:\temp\e2e-sdcard
          mkdir C:\temp\e2e-test-data
          if exist tests\fixtures xcopy tests\fixtures C:\temp\e2e-test-data\ /E /I /Q
        shell: cmd

      - name: Build application
        run: npm run build

      - name: Verify build output (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          echo "Checking build output..."
          ls -la dist/
          ls -la dist/electron/
          ls -la dist/electron/main/
          if [ ! -f "dist/electron/main/index.js" ]; then
            echo "ERROR: Main Electron file not found!"
            exit 1
          fi
          echo "Build verification successful"
        shell: bash

      - name: Verify build output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Checking build output..."
          dir dist\
          dir dist\electron\
          dir dist\electron\main\
          if (!(Test-Path "dist\electron\main\index.js")) {
            Write-Error "ERROR: Main Electron file not found!"
            exit 1
          }
          echo "Build verification successful"
        shell: pwsh

      - name: Setup virtual display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          # Validate Xvfb is ready with retry (up to 10 attempts, 1s apart)
          for i in $(seq 1 10); do
            if DISPLAY=:99 xdpyinfo > /dev/null 2>&1; then
              echo "Xvfb display :99 ready after $i attempt(s)"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "ERROR: Xvfb display :99 failed to start after 10 attempts"
              exit 1
            fi
            echo "Waiting for Xvfb... attempt $i/10"
            sleep 1
          done

      - name: Run end-to-end tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        # test:play (not test:e2e) — the build already ran above; test:e2e
        # would rebuild a second time.
        run: npm run test:play
        env:
          ROMPER_SDCARD_PATH: /tmp/e2e-sdcard
          # Performance budget results, for the testing summary
          ROMPER_BUDGET_REPORT: reports/budgets-e2e.jsonl
          CI: true
          DISPLAY: ":99"

      - name: Run end-to-end tests (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run test:play
        env:
          ROMPER_SDCARD_PATH: C:\temp\e2e-sdcard
          ROMPER_BUDGET_REPORT: reports/budgets-e2e.jsonl
          CI: true

      # Playwright retries a failed test once on CI; a test that passed only
      # on retry doesn't fail the job, so list it here to be filed (#659)
      - name: List tests that passed only on retry
        if: always()
        run: node scripts/e2e-flaky-summary.mjs reports/results-e2e.json --platform "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.os }}
        shell: bash

      - name: Upload results for the testing summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-e2e-${{ matrix.os }}
          path: reports/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: test-results/**/*.png
          retention-days: 7

  # The required check: reports on every run, whichever runners ran, and
  # fails if choosing them failed or any of them did
  e2e-tests-check:
    runs-on: ubuntu-latest
    needs: [plan, e2e-tests]
    if: always()
    steps:
      - name: Check e2e test results
        env:
          OS: ${{ needs.plan.outputs.os }}
          PLAN: ${{ needs.plan.result }}
          RESULT: ${{ needs.e2e-tests.result }}
        run: |
          echo "Runners: $OS"
          if [[ "$PLAN" == "success" && "$RESULT" == "success" ]]; then
            echo "All e2e tests passed!"
            exit 0
          else
            echo "Some e2e tests failed! (plan: $PLAN, e2e-tests: $RESULT)"
            exit 1
          fi

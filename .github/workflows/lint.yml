name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    # edited: the traceability check counts the issues a PR fixes
    # ("Fixes #N" in its description) as closed, so rerun it when the
    # description changes.
    types: [opened, synchronize, reopened, edited]
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # Cancel superseded runs on the same branch/PR; never cancel main-push runs
  # (they carry coverage + SonarCloud).
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The traceability check reads open issues and labels, and the issues
    # this PR fixes.
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # lint:check (no --fix) so violations fail CI instead of being
        # silently auto-fixed in the throwaway runner workspace.
        run: npm run lint:check

      - name: Check use case traceability
        # Fails on unknown [UC-NN] tags, supported use cases with no test
        # above unit level (RE-67), open issues without a UC/Q label, and
        # statuses that don't match the open issues. Writes the use case x
        # test layer matrix to the job summary.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run trace:check

name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    # edited: the traceability check counts the issues a PR fixes
    # ("Fixes #N" in its description) as closed, so rerun it when the
    # description changes.
    types: [opened, synchronize, reopened, edited]
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # Cancel superseded runs on the same branch/PR; never cancel main-push runs
  # (they carry coverage + SonarCloud).
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The traceability check reads open issues and labels, and the issues
    # this PR fixes.
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run ESLint
        # lint:check (no --fix) so violations fail CI instead of being
        # silently auto-fixed in the throwaway runner workspace.
        run: npm run lint:check

      - name: Check use case traceability
        # Fails on unknown [UC-NN] tags, closed test gaps and hand-set
        # supported or partial statuses (RE-67). Generates each use case's
        # status from the open issues and writes it, with the use case x
        # test layer matrix, to the job summary. Warns (annotations and the
        # job summary) on what a release can't ship with: an issue or use
        # case without its label, or a supported use case with no test above
        # unit level and no declared gap; the release fails on those
        # (--strict-issues in release.yml). Lists issues that need triage.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run trace:check

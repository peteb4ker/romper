name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

  # The testing page shows the latest release's results
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Get the latest release's testing summary
        # Published by the release workflow; the page says so when it's
        # missing (releases before it existed)
        run: |
          mkdir -p docs/_data
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern testing-summary.json --output docs/_data/testing.json \
            || echo "The latest release has no testing summary"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

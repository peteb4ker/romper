name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

  # The release job starts this after publishing, so the testing page shows
  # the new release's results; run it by hand to republish them. (A
  # `release` trigger never fires: the release is published with
  # GITHUB_TOKEN, whose events don't start workflows.)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Get the latest release's testing summary
        # Published by the release workflow (scripts/testing-summary.mjs).
        # Fail rather than deploy a testing page with no results.
        run: |
          mkdir -p docs/_data
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern testing-summary.json --output docs/_data/testing.json
          if ! jq -e '(.version | type == "string" and length > 0)
              and (.layers.unit.tests > 0) and (.groups | length > 0)' \
              docs/_data/testing.json > /dev/null; then
            echo "::error::The latest release's testing-summary.json has no results"
            exit 1
          fi
          echo "Testing summary: $(jq -r .version docs/_data/testing.json)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

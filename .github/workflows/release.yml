name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason (e.g. testing signing on a non-tag branch). The `release` job is gated to tag pushes only, so manual runs build artifacts but do not publish."
        required: false
        default: "manual test run"

# Least privilege (RE-19): each job asks for what it needs below.
permissions:
  contents: read

jobs:
  # Nothing is built until the tag and the code are known to be releasable
  # (RE-17): the tag is on main and matches package.json, SonarCloud's gate
  # passes, and the test suites below pass on the tagged commit.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      mac-signing: ${{ steps.signing.outputs.mac-signing }}
      windows-signed: ${{ steps.signing.outputs.windows-signed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit that has merged to main."
            exit 1
          fi
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main and matches package.json"

      # Signing used to be silently optional (RE-18): Windows v1.3.1 shipped
      # unsigned because its secrets were empty, and missing Apple secrets
      # would have skipped macOS signing too. A tag build now needs the
      # macOS secrets. Windows may ship unsigned only while the repo
      # variable ALLOW_UNSIGNED_WINDOWS is "true", and the release notes
      # then say so.
      #
      # The build job gates its signing steps on these outputs, so no
      # signing secret has to sit in a job-level environment (RE-19).
      # Manual runs sign when the secrets exist and skip signing otherwise.
      - name: Check signing is configured
        id: signing
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          missing() {
            local name out=()
            for name in "$@"; do [ -n "${!name}" ] || out+=("$name"); done
            echo "${out[*]}"
          }
          APPLE_MISSING=$(missing APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD ASC_API_KEY_JSON)
          AZURE_MISSING=$(missing AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ACCOUNT AZURE_CERTIFICATE_PROFILE)
          if [ "$IS_TAG" != "true" ]; then
            # A manual run: sign what can be signed, release nothing
            [ -z "$APPLE_MISSING" ] && echo "mac-signing=true" >> "$GITHUB_OUTPUT"
            [ -z "$AZURE_MISSING" ] && echo "windows-signed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: macOS signing ${APPLE_MISSING:+not }configured, Windows signing ${AZURE_MISSING:+not }configured"
            exit 0
          fi
          if [ -n "$APPLE_MISSING" ]; then
            echo "::error::macOS signing secrets are missing: $APPLE_MISSING. An unsigned macOS build can't be released."
            exit 1
          fi
          echo "mac-signing=true" >> "$GITHUB_OUTPUT"
          if [ -z "$AZURE_MISSING" ]; then
            echo "windows-signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED_WINDOWS" = "true" ]; then
            echo "::warning::Windows signing secrets are missing ($AZURE_MISSING); the Windows build ships unsigned because ALLOW_UNSIGNED_WINDOWS is true, and the release notes say so."
            echo "windows-signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Windows signing secrets are missing: $AZURE_MISSING. Configure Azure Trusted Signing, or set the repo variable ALLOW_UNSIGNED_WINDOWS to true to ship an unsigned Windows build."
            exit 1
          fi

      # Use case statuses are generated from the open issues, so the release
      # must be able to read them. It also can't ship an issue or use case
      # without its label, or a supported use case with no test above unit
      # level that doesn't declare the gap. Pull requests only warn on these
      # (anyone can open or close an issue); a release fails on them.
      - name: Set up Node.js
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: npm ci

      - name: Check the use cases against the open issues
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run trace:check -- --strict-issues

      # v1.3.0 was lost to an expired Apple agreement that only showed up at
      # notarize time, after every platform had built.
      - name: Check the App Store Connect key and agreements
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
        run: node scripts/check-notary-credentials.mjs

      - name: Check SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Fail closed: an unreachable API, an empty answer or a gate that
          # isn't OK all block the release.
          sonar() {
            curl -sSf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/$1"
          }
          STATUS=$(sonar "qualitygates/project_status?projectKey=peteb4ker_romper" | jq -r '.projectStatus.status')
          ISSUES=$(sonar "issues/search?projectKeys=peteb4ker_romper&severities=CRITICAL,BLOCKER&statuses=OPEN,CONFIRMED&ps=1" | jq -r '.total')
          HOTSPOTS=$(sonar "hotspots/search?projectKey=peteb4ker_romper&status=TO_REVIEW&ps=1" | jq -r '.paging.total')

          echo "Quality Gate: $STATUS | Critical/Blocker: $ISSUES | Hotspots: $HOTSPOTS"

          if [ "$STATUS" != "OK" ]; then
            echo "::error::Release blocked: SonarCloud quality gate is '$STATUS', not OK"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ && "$HOTSPOTS" =~ ^[0-9]+$ ]]; then
            echo "::error::Release blocked: SonarCloud returned no issue or hotspot counts"
            exit 1
          fi
          if [ "$ISSUES" -gt 0 ] || [ "$HOTSPOTS" -gt 0 ]; then
            echo "::error::Release blocked: $ISSUES critical/blocker issues, $HOTSPOTS security hotspots"
            exit 1
          fi

      - name: Create GitHub issue on failure
        if: failure() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }} blocked: preflight failed" \
            --label "bug,priority:high,severity:high,Q-05" \
            --body "Release **${{ github.ref_name }}** didn't pass preflight (tag on main and matching package.json, signing secrets, Apple credentials and agreements, SonarCloud gate). See [the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          - [Issues](https://sonarcloud.io/project/issues?id=peteb4ker_romper&severities=CRITICAL,BLOCKER)
          - [Hotspots](https://sonarcloud.io/project/security_hotspots?id=peteb4ker_romper)

          _Auto-created by release workflow._"

  # The same suites CI runs, on the tagged commit. CI on main can't stand in:
  # a push to main replaces the previous main run while it is still queued,
  # so many commits never get a complete run.
  lint:
    needs: preflight
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/lint.yml

  typecheck:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/typecheck.yml

  tests:
    needs: preflight
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/test.yml

  e2e:
    needs: preflight
    # pull-requests: read for e2e.yml's plan job, which lists a PR's files
    # (on a tag push it doesn't, but a called workflow's jobs can't ask for
    # more than the caller grants)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml

  # The full-pipeline rehearsal on all three platforms: factory archive to a
  # card, byte for byte, plus the performance profile. A release ships only
  # if it passes, and its results are published with the release.
  validate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/validate-full.yml

  build:
    needs: [preflight, lint, typecheck, tests, e2e, validate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-name: linux-artifacts
          - os: macos-latest
            platform: darwin
            artifact-name: mac-artifacts
          - os: windows-latest
            platform: win32
            artifact-name: windows-artifacts

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    # Signing steps gate on preflight's outputs. Secrets appear only in the
    # steps that use them, never in the job's environment, so `npm ci` and
    # the build don't run with them (RE-19).

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev \
            libgtk-3-0

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # ── macOS: Package unsigned, sign with rcodesign, then make DMG/zip ──
      # See electron/forge#3131: @electron/osx-sign was silently falling back
      # to ad-hoc signing in CI. Replaced with indygreg/apple-code-sign-action
      # (rcodesign), which signs without needing a keychain.
      - name: Package Electron app (unsigned) — macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-forge package -p darwin -a arm64

      - name: Materialize signing inputs — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
        run: |
          # Decode p12 from base64 secret
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          chmod 600 "$RUNNER_TEMP/cert.p12"
          # Write ASC API key JSON (produced by `rcodesign encode-app-store-connect-api-key`)
          printf '%s' "$ASC_API_KEY_JSON" > "$RUNNER_TEMP/asc-api-key.json"
          chmod 600 "$RUNNER_TEMP/asc-api-key.json"

      - name: Sign Romper.app — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        uses: indygreg/apple-code-sign-action@5e7a4a01fe4dffe948ef3bcf1f4538d963cb0c72 # v1.2
        with:
          input_path: out/Romper-darwin-arm64/Romper.app
          p12_file: ${{ runner.temp }}/cert.p12
          p12_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # --for-notarization enables hardened runtime + timestamp server +
          # Developer ID cert validation in one flag.
          #
          # --config-file points at electron/resources/rcodesign.toml, which
          # declares per-helper entitlement scopes. v1.1.0 shipped with the
          # top-level binary entitled but the Chromium helpers (Renderer/GPU/
          # Plugin) unentitled, breaking V8 under hardened runtime and causing
          # a renderer white-screen. See #260.
          sign_args: |
            --for-notarization
            --config-file
            electron/resources/rcodesign.toml

      # ── Install rcodesign for the manual notarize+staple steps below.
      # The action hardcodes --max-wait-seconds 600 (10 min); Apple's notary
      # service occasionally exceeds that (sub 8b66b65c-3708-41dd-bf4a-…
      # took ~16h during a 2026-06-02 outage). Bumped to 30 min here.
      - name: Install rcodesign for notarization
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        run: |
          set -euo pipefail
          VERSION="0.29.0"
          ASSET="apple-codesign-${VERSION}-macos-universal.tar.gz"
          EXPECTED_SHA="d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d"
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${VERSION}/${ASSET}"
          ACTUAL_SHA=$(shasum -a 256 "$RUNNER_TEMP/$ASSET" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::rcodesign tarball SHA mismatch (expected $EXPECTED_SHA, got $ACTUAL_SHA)"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apple-codesign-${VERSION}-macos-universal" >> "$GITHUB_PATH"

      # ── Notarize + staple the .app BEFORE Forge wraps it.
      # This makes the .app self-contained: the ticket is embedded inside
      # the bundle, so any container we put it in (DMG, zip, future tar)
      # is Gatekeeper-clean offline. Without this step, the zip artifact
      # carries a signed-but-not-stapled .app and offline macOS shows the
      # "cannot verify developer" warning until first online launch.
      - name: Notarize + staple Romper.app — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        run: |
          rcodesign notary-submit \
            --staple \
            --max-wait-seconds 1800 \
            --api-key-file "$RUNNER_TEMP/asc-api-key.json" \
            out/Romper-darwin-arm64/Romper.app

      # The packaged app's smoke test and Forge's makers run third-party
      # code; the signing inputs aren't on disk while they do (RE-19). They
      # are written again for the DMG below.
      - name: Remove signing inputs — macOS
        if: always() && matrix.os == 'macos-latest'
        run: |
          rm -P "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
          rm -P "$RUNNER_TEMP/asc-api-key.json" 2>/dev/null || true

      # Unit and e2e tests run the unpackaged app, which skips the updater;
      # only a packaged run shows it loads (RE-16).
      - name: Smoke-test the packaged app — macOS
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-packaged-app.mjs out/Romper-darwin-arm64/Romper.app/Contents/MacOS/romper

      - name: Make installers from the signed package — macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-forge make --from-package -p darwin -a arm64

      - name: Locate DMG artifact — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        id: dmg_path
        run: |
          DMG=$(find out/make -maxdepth 3 -name '*.dmg' -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced by Forge"
            find out/make -type f
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"

      - name: Materialize signing inputs for the DMG — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ASC_API_KEY_JSON: ${{ secrets.ASC_API_KEY_JSON }}
        run: |
          # Decode p12 from base64 secret
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          chmod 600 "$RUNNER_TEMP/cert.p12"
          # Write ASC API key JSON (produced by `rcodesign encode-app-store-connect-api-key`)
          printf '%s' "$ASC_API_KEY_JSON" > "$RUNNER_TEMP/asc-api-key.json"
          chmod 600 "$RUNNER_TEMP/asc-api-key.json"

      - name: Sign DMG — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        uses: indygreg/apple-code-sign-action@5e7a4a01fe4dffe948ef3bcf1f4538d963cb0c72 # v1.2
        with:
          input_path: ${{ steps.dmg_path.outputs.path }}
          p12_file: ${{ runner.temp }}/cert.p12
          p12_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Notarize + staple the DMG too so the DMG itself (not just the .app
      # inside) carries a ticket — needed for offline Gatekeeper checks
      # during DMG mount.
      - name: Notarize + staple DMG — macOS
        if: matrix.os == 'macos-latest' && needs.preflight.outputs.mac-signing == 'true'
        run: |
          rcodesign notary-submit \
            --staple \
            --max-wait-seconds 1800 \
            --api-key-file "$RUNNER_TEMP/asc-api-key.json" \
            "${{ steps.dmg_path.outputs.path }}"

      # ── Linux / Windows: Forge handles everything in one step ──
      - name: Package application (Electron) — Linux/Windows
        if: matrix.os != 'macos-latest'
        run: npm run make

      # ── Windows: Sign artifacts with Azure Trusted Signing ──
      - name: Sign Windows artifacts with Azure Trusted Signing
        if: matrix.os == 'windows-latest' && needs.preflight.outputs.windows-signed == 'true'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: out/make/squirrel.windows/x64/
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── macOS: Wipe signing inputs from the runner ──
      - name: Clean up signing inputs — macOS
        if: always() && matrix.os == 'macos-latest'
        run: |
          rm -P "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
          rm -P "$RUNNER_TEMP/asc-api-key.json" 2>/dev/null || true

      - name: Debug artifact structure (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Project root contents ==="
          Get-ChildItem -Force
          echo "=== Looking for out directory ==="
          Get-ChildItem -Recurse -Directory -Name "out" -ErrorAction SilentlyContinue
          echo "=== Looking for make directory ==="
          Get-ChildItem -Recurse -Directory -Name "make" -ErrorAction SilentlyContinue
          echo "=== All files with 'romper' or app name ==="
          Get-ChildItem -Recurse -Name "*romper*", "*Romper*" -ErrorAction SilentlyContinue | Select-Object -First 20

      - name: Debug artifact structure (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "=== Project root contents ==="
          ls -la
          echo "=== Looking for out directory ==="
          find . -name "out" -type d
          echo "=== Looking for make directory ==="
          find . -name "make" -type d
          echo "=== All files with 'romper' or app name ==="
          find . -name "*romper*" -o -name "*Romper*" | head -20

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: out/make/
          retention-days: 7

  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      issues: read # list the issues the release fixed, for its notes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for commit parsing
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/

      - name: Display structure of downloaded files
        run: find release-artifacts -type f -name "*" | head -20

      - name: Summarise the release's checks
        # Read by the website's testing page (docs/testing.html). Each use
        # case's status is generated from the open issues, read with gh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node scripts/testing-summary.mjs release-artifacts
          --version ${{ github.ref_name }} --commit ${{ github.sha }}
          --out release-artifacts/testing-summary.json

      # The notes list the issues closed as completed since the previous
      # tag, which the script reads with gh. Without a token it leaves that
      # section out and warns.
      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate release notes using the Node.js script
          RELEASE_NOTES=$(node scripts/generate-github-release-notes.js ${{ github.ref_name }})

          # An unsigned Windows build is only ever shipped knowingly (RE-18)
          if [ "${{ needs.preflight.outputs.windows-signed }}" = "false" ]; then
            RELEASE_NOTES="$RELEASE_NOTES

          > **Windows:** this build isn't code-signed yet, so Windows SmartScreen warns when you run the installer. Choose **More info**, then **Run anyway**."
          fi

          # Output to GitHub Actions
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: Romper Sample Manager ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.notes }}
          artifacts: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
            release-artifacts/testing-summary.json
          # Tags containing a hyphen (e.g. v1.3.0-rc.1) are prereleases:
          # published on GitHub but NOT marked latest, so the
          # update.electronjs.org feed (which serves the latest stable
          # release) never pushes them to existing users via auto-update.
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
          draft: false

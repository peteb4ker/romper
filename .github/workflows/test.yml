name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # Cancel superseded runs on the same branch/PR; never cancel main-push runs
  # (they carry coverage + SonarCloud).
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests - runs independently and uploads coverage
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Code checkout (shallow for performance)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Node.js setup with enhanced caching
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # Install dependencies
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Coverage runs on PRs too (~10s slower than test:unit:fast) so
      # SonarCloud can analyze PRs, including coverage on new code.
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Upload unit coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: coverage/unit/
          retention-days: 1

  # Cross-platform integration tests - runs in parallel with unit tests
  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        # All three OSes on PRs too: they take about a minute, and Windows-only
        # failures (file locking, chmod semantics) otherwise reach main unseen.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      # Code checkout (shallow for performance)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Node.js setup with enhanced caching
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # Install dependencies
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # System dependencies for Electron (Ubuntu only, optimized)
      - name: Install Electron dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev \
            libgtk-3-0 \
            xvfb

      # Virtual display setup (Linux only, optimized)
      - name: Setup virtual display
        if: matrix.os == 'ubuntu-latest'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true
          DISPLAY: ${{ matrix.os == 'ubuntu-latest' && ':99' || '' }}

      - name: Upload integration coverage artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: integration-coverage
          path: coverage/integration/
          retention-days: 1

  # Coverage merge + SonarCloud. Runs on main pushes and on same-repo PRs
  # (fork and Dependabot PRs don't get SONAR_TOKEN), not when the release
  # workflow runs the tests on a tag.
  analysis:
    needs: [unit-tests, integration-tests]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # The SonarCloud Scan step exceeded the previous 8-minute limit and was
    # killed mid-scan on every main push, so SonarCloud had not re-analyzed
    # since 2026-04-10. Give the scan room to complete.
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: read
    # Step-level `if:` can't see secrets or a step's own env, so expose the
    # token at job level.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Code checkout (full history for SonarCloud)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node.js setup with enhanced caching
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # Install dependencies (minimal, no rebuild needed)
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      # Download coverage artifacts from previous jobs
      - name: Download unit coverage artifacts
        uses: actions/download-artifact@v5
        with:
          name: unit-coverage
          path: coverage/unit/

      - name: Download integration coverage artifacts
        uses: actions/download-artifact@v5
        with:
          name: integration-coverage
          path: coverage/integration/

      # Merge coverage reports without re-running tests
      - name: Merge coverage reports
        run: |
          npm run coverage:merge
          npm run coverage:total

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: peteb4ker/romper
          files: ./coverage/merged/coverage-final.json
          disable_search: true

      # sonarcloud-github-action was deprecated and its bundled scanner
      # stopped working (no analysis landed after 2026-07-21).
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Risk-informed quality gate check with deduplication
      - name: Check quality gate and manage issues
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GATE=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=peteb4ker_romper")
          STATUS=$(echo "$GATE" | jq -r '.projectStatus.status')

          ISSUES_RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=peteb4ker_romper&severities=CRITICAL,BLOCKER,MAJOR&statuses=OPEN,CONFIRMED&ps=1")
          CRITICAL=$(echo "$ISSUES_RESP" | jq -r '.total')

          HOTSPOTS_RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/hotspots/search?projectKey=peteb4ker_romper&status=TO_REVIEW&ps=1")
          HOTSPOTS=$(echo "$HOTSPOTS_RESP" | jq -r '.paging.total')

          FAILED_CONDITIONS=$(echo "$GATE" | jq -r \
            '.projectStatus.conditions[] | select(.status == "ERROR") | "- **\(.metricKey)**: \(.actualValue) (required: \(.errorThreshold))"')

          ISSUE_TITLE="SonarCloud: quality gate failure on main"

          # Find CI's own auto-managed gate tracker. Match the exact title — NOT
          # just the shared "sonarcloud" label — so human-created issues that also
          # carry the label are never auto-closed when the gate passes.
          EXISTING=$(gh issue list --label "sonarcloud" --state open --json number,title,body --limit 30 \
            | jq --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)][0:1]')
          EXISTING_NUMBER=$(echo "$EXISTING" | jq -r '.[0].number // empty')

          if [ "$STATUS" != "OK" ]; then
            if [ -n "$EXISTING_NUMBER" ]; then
              # Extract previous issue count from existing issue body
              PREV_CRITICAL=$(echo "$EXISTING" | jq -r '.[0].body' | grep -oP 'Critical/Blocker/Major Issues:\*\* \K\d+' || echo "0")
              if [ "$CRITICAL" -gt "${PREV_CRITICAL:-0}" ]; then
                gh issue comment "$EXISTING_NUMBER" --body "## Quality Gate Still Failing — Worsened

          **Commit:** ${{ github.sha }}
          **Critical/Blocker/Major Issues:** $CRITICAL (was $PREV_CRITICAL)
          **Security Hotspots to Review:** $HOTSPOTS

          ### Failed Conditions
          $FAILED_CONDITIONS

          _Updated by CI on main branch push._"
                echo "::warning::SonarCloud issues worsened ($PREV_CRITICAL → $CRITICAL) — commented on #$EXISTING_NUMBER"
              else
                echo "SonarCloud quality gate still failing but not worsened (issues: $CRITICAL, was: $PREV_CRITICAL) — skipping duplicate"
              fi
            else
              # No existing issue — create a new one
              gh issue create \
                --title "$ISSUE_TITLE" \
                --label "bug,priority:high,sonarcloud" \
                --body "## SonarCloud Quality Gate Failed

          **Commit:** ${{ github.sha }}
          **Quality Gate:** $STATUS
          **Critical/Blocker/Major Issues:** $CRITICAL
          **Security Hotspots to Review:** $HOTSPOTS

          ### Failed Conditions
          $FAILED_CONDITIONS

          ### Links
          - [Issues](https://sonarcloud.io/project/issues?id=peteb4ker_romper&severities=CRITICAL,BLOCKER,MAJOR)
          - [Security Hotspots](https://sonarcloud.io/project/security_hotspots?id=peteb4ker_romper)
          - [Quality Gate](https://sonarcloud.io/summary/overall?id=peteb4ker_romper)

          _Auto-created by CI on main branch push._"
              echo "::warning::SonarCloud quality issues detected — GitHub issue created"
            fi
          else
            if [ -n "$EXISTING_NUMBER" ]; then
              gh issue close "$EXISTING_NUMBER" --comment "## Quality Gate Passed

          Quality gate passed on commit ${{ github.sha }}. Auto-closing.

          _Resolved by CI on main branch push._"
              echo "SonarCloud quality gate passed — auto-closed #$EXISTING_NUMBER"
            else
              echo "SonarCloud quality gate passed"
            fi
          fi

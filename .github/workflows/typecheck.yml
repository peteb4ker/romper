name: TypeCheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  # The release workflow runs this on the tagged commit (RE-17)
  workflow_call:

concurrency:
  # One group per pull request head commit, so two runs for the same commit
  # (GitHub sometimes delivers an event twice) never cancel each other: the
  # second waits for the first, then runs, so the newer one finishes last
  # and its result stands (#695). cancel-stale-runs.yml cancels a pull
  # request's runs for its older commits. Other runs have no pull request
  # head, so they share one group per ref and queue rather than cancel:
  # main-push runs carry coverage + SonarCloud.
  # A literal name: in a workflow the release calls, github.workflow is
  # "Release", which would put all four suites in one group.
  group: typecheck-${{ github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run TypeScript type checking
        run: npm run typecheck

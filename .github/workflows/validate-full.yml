name: Full-Pipeline Validation

# The on-demand full-pipeline validation (RE-67; plan:
# docs/developer/validation-and-traceability.md): factory archive -> new store
# -> new kit with stereo samples -> write to a folder -> byte-for-byte
# comparison, with every UI error and warning captured. Too heavy for PRs;
# run it by hand, or call it from another workflow (a release, later).

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Download the factory archive from Squarp instead of using the cached copy"
        type: boolean
        default: false
  workflow_call:
    inputs:
      fresh:
        type: boolean
        default: false

concurrency:
  # A literal name: in a calling workflow, github.workflow is the caller's
  group: validate-full-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node, node_modules and the Electron binary, with the node-gyp
      # headers from main's cache so npm ci makes no request to nodejs.org
      # (#860). This workflow never runs on a push to main, so it only reads
      # those caches.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          electron: "true"

      # Our copy of Squarp's archive, keyed by its recorded SHA-256, so each
      # archive version is downloaded from Squarp once, not once per run.
      # factory-archive-cache.yml saves it from main (#865), where every
      # branch and release tag can read it; this workflow only restores (a
      # copy it saved would be private to its own branch or tag). It's one
      # cross-OS entry for all three platforms. On a miss the validation
      # downloads the archive for this run only. The cache is private to this
      # repo; the archive is never uploaded as an artifact (it's Squarp's
      # content).
      - name: Find the factory archive's key
        id: archive-key
        shell: bash
        run: echo "sha256=$(node -p "require('./tests/validation/factory-archive.json').sha256")" >> "$GITHUB_OUTPUT"

      - name: Restore the factory archive
        uses: actions/cache/restore@v6
        with:
          path: .factory-archive-cache
          key: factory-archive-${{ steps.archive-key.outputs.sha256 }}
          enableCrossOsArchive: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2-dev \
            libgtk-3-0 x11-utils xvfb
          # The binary came with Install dependencies (electron: "true")
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          for i in $(seq 1 10); do
            DISPLAY=:99 xdpyinfo > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Xvfb didn't start"
          exit 1

      - name: Run the validation
        run: npm run validate:full ${{ inputs.fresh && '-- --fresh' || '' }}
        env:
          CI: true
          DISPLAY: ":99"
          ROMPER_ARCHIVE_CACHE_DIR: ${{ github.workspace }}/.factory-archive-cache

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ matrix.os }}
          path: |
            validation-report/
            test-results/validation/
          retention-days: 30
